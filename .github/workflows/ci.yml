name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: Restore API
        run: dotnet restore backend/src/Raventa.Api/Raventa.Api.csproj
      - name: Build API
        run: dotnet build backend/src/Raventa.Api/Raventa.Api.csproj --configuration Release --no-restore --nologo
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build
      - name: Run .NET tests when present
        shell: bash
        run: |
          mapfile -t tests < <(find . -type f \( -name '*Tests.csproj' -o -name '*Test.csproj' \) -not -path '*/bin/*' -not -path '*/obj/*')
          if [ "${#tests[@]}" -eq 0 ]; then
            echo "No .NET test projects found; no tests were invented."
            exit 0
          fi
          for test in "${tests[@]}"; do
            dotnet test "$test" --configuration Release --no-restore --nologo
          done
